<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Accept Terplus bitmap fonts</description>
  <selectfont>
    <acceptfont>
      <pattern>
        <patelt name="family"><string>Terplus</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>misc Terplus</string></patelt>
      </pattern>
    </acceptfont>
  </selectfont>
</fontconfig>
